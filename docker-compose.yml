services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    environment:
      PROTHEUS_API_KEY: ${PROTHEUS_API_KEY}
      NGINX_ENVSUBST_VARS: '$PROTHEUS_API_KEY'
    networks:
      - default
      - supabase
    container_name: sarem_web
    ports:
      - "82:82"
    restart: unless-stopped

networks:
  supabase:
    external: true
    name: supabase_network_SAREM
